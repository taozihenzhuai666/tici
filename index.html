<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-title" content="提词器">
<link rel="apple-touch-icon" sizes="180x180" href="tici-icon-v1-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="tici-icon-v1-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>悬浮提词器</title>
<style>
/* Layout: one narrow column — mode switch, script, mode panel. Shooting is a full-screen layer: camera below, prompter pinned under the front lens. Single dark look like a camera app. */
:root {
  color-scheme: dark;
  --bg: #0d0f14;
  --panel: #171a22;
  --line: #262a35;
  --fg: #eef0f5;
  --muted: #9aa1b2;
  --accent: #ff5a3c;
  --accent-fg: #ffffff;
  --ok: #4cd68a;
  --radius: 14px;
  --font: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; touch-action: manipulation; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
.rec-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 2px; }
.hint { color: var(--muted); font-size: 14px; }



label.field { display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 8px; }
.fhead { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
.fhead .count { flex: 1; font-size: 13px; font-variant-numeric: tabular-nums; }
.mini { min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 14px var(--font); }
.mini.warn { color: var(--accent); border-color: var(--accent); }
textarea {
  width: 100%; min-height: 180px; resize: vertical;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; font: 17px/1.6 var(--font);
}
textarea:focus, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { display: flex; flex-direction: column; gap: 16px; }
.ctl { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ctl .top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.ctl .top b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 15px var(--font); }
.seg button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.go { min-height: 56px; border: 0; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font: 600 18px var(--font); letter-spacing: .04em; cursor: pointer; }
.go:disabled { opacity: .55; }
.go.stop { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
.status { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.status.ok { color: var(--ok); }
.status.err { color: var(--accent); }

.steps { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 15px; line-height: 1.65; }
.steps h2 { font-size: 15px; margin: 0 0 6px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.steps ol { margin: 0; padding-left: 1.3em; }

/* ---------- shooting layer ---------- */
#shoot { position: fixed; inset: 0; z-index: 10; background: #000; overflow: hidden; touch-action: manipulation; }
#cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.prompter {
  position: absolute; left: 0; right: 0; top: 0;
  height: calc(env(safe-area-inset-top, 0px) + var(--ph, 34vh));
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(0,0,0,.78) 78%, rgba(0,0,0,0));
  overflow: hidden;
}
.ptext { position: relative; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,.95); white-space: pre-wrap; word-break: break-all; will-change: transform; }
.ptext span.d { color: rgba(255,255,255,.32); }
.ptext span.cur { color: #fff; background: rgba(255,90,60,.55); border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .ptext { transition: transform .35s ease-out; } }
.readline { position: absolute; left: 4px; width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 11px solid var(--accent); }

.heard {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + var(--ph, 34vh) + 6px);
  max-width: 90%; font-size: 13px; color: #fff; background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 99px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.heard i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 0; }
.heard.on i { background: var(--ok); }

.sbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 8px;
  background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6));
}
.sbar .l, .sbar .r { display: flex; gap: 8px; align-items: center; }
.sbar .r { justify-content: flex-end; }
.sbar .recbtn { flex: 0 0 auto; margin: 0 calc(50% - 38px); }
.chip { min-height: 48px; min-width: 48px; padding: 0 12px; white-space: nowrap; border-radius: 99px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.45); color: #fff; font: 600 15px var(--font); }
.recbtn { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: transparent; padding: 0; display: grid; place-items: center; }
.recbtn i { display: block; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); }
.recbtn:disabled { opacity: .6; }
.recbtn.on i { width: 28px; height: 28px; border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) { .recbtn i { transition: all .2s; } }
.timer { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(186px + env(safe-area-inset-bottom, 0px)); font: 600 15px var(--mono); color: #fff; background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.timer.on { background: var(--accent); }
.res { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(186px + env(safe-area-inset-bottom, 0px)); font: 600 13px var(--mono); color: #fff; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 8px; }
.res:empty { display: none; }
.mic { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(186px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; font-size: 12px; color: #fff; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 8px; }
.mic b { display: block; width: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.mic i { display: block; height: 100%; width: 0; background: var(--ok); }

.done {
  position: absolute; inset: auto 0 0 0; z-index: 2;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 12px;
}
.done { padding-top: 0; }
.grab { touch-action: none; }
@media (prefers-reduced-motion: no-preference) { .done.snap { transition: transform .25s ease-out; } }
.done.collapsed { transform: translateY(calc(100% - 64px - env(safe-area-inset-bottom, 0px))); }
.grab { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 48px; padding-top: 10px; margin: 0 -16px; cursor: grab; border: 0; background: transparent; color: var(--muted); font: 14px var(--font); width: calc(100% + 32px); }
.grab::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.done video { width: 100%; max-height: 42vh; border-radius: 12px; background: #000; }
.done .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.done a { color: var(--muted); font-size: 14px; text-align: center; }
/* landscape: prompter across the top, controls in a column on the right */
@media (orientation: landscape) {
  #shoot { --ph: 42vh; }
  .prompter { right: calc(116px + env(safe-area-inset-right, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 6px); }
  .heard { left: calc(50% - 58px); }
  .sbar {
    left: auto; top: 0; bottom: 0; right: 0; width: calc(116px + env(safe-area-inset-right, 0px));
    padding: max(10px, env(safe-area-inset-top, 0px)) env(safe-area-inset-right, 0px) max(10px, env(safe-area-inset-bottom, 0px)) 0;
    flex-direction: column; flex-wrap: nowrap; justify-content: center; gap: 10px;
    background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.6));
  }
  .sbar .l, .sbar .r { flex-direction: column; gap: 8px; }
  .sbar .l { order: -1; } .sbar .r { order: 1; }
  .sbar .recbtn { order: 0; margin: 2px 0; }
  .chip { min-width: 96px; }
  .timer, .res, .mic { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .timer { right: calc(128px + env(safe-area-inset-right, 0px)); }
  .mic { left: calc(50% - 58px); }
  .done { display: grid; grid-template-columns: minmax(0, 1fr) 240px; align-content: start; column-gap: 14px; row-gap: 10px; }
  .done .grab { grid-column: 1 / -1; }
  .done video { grid-column: 1; grid-row: 2 / span 3; max-height: 60vh; }
  .done .btns { grid-column: 2; grid-template-columns: 1fr; }
  .done #doneBack, .done a { grid-column: 2; }
}
.toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: 80%; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="rec-dot"></span>悬浮提词器</h1>
  </header>

  <div class="field">
    <div class="fhead">
      <label for="script">台词</label>
      <span class="count" id="count"></span>
      <button class="mini" id="clear" type="button">清空</button>
    </div>
    <textarea id="script" placeholder="把台词粘贴到这里"></textarea>
  </div>

  <section class="panel">
    <div class="ctl">
      <div class="top"><span>字号</span></div>
      <div class="seg" id="fsize">
        <button type="button" data-v="24">小</button>
        <button type="button" data-v="30" aria-pressed="true">中</button>
        <button type="button" data-v="38">大</button>
      </div>
    </div>
    <button class="go" id="openCam" type="button">打开前置摄像头</button>
    <div class="status" id="fst"></div>
    <div class="steps">
      <h2>怎么用</h2>
      <ol>
        <li>台词显示在屏幕最上面，贴着前置镜头，看字就像在看镜头。</li>
        <li>竖着拿就录竖屏，横过来就录横屏（先在控制中心关掉“竖排方向锁定”）。转好方向再点录像，录的中途别转。</li>
        <li>点红色按钮开始录像，正常说话就行。说到哪，台词就滚到哪；停下来它也停。</li>
        <li>念错、跳过一两句也没关系，它会找回你在读的位置。点台词里的任何一个字，也能直接跳过去。</li>
        <li>听不清的时候，可以点左下角切到“匀速”。</li>
        <li>录完点“保存视频”，在弹出的菜单里选“存储视频”就进了相册。</li>
      </ol>
    </div>
  </section>

</div>

<!-- 拍摄层 -->
<div id="shoot" hidden>
  <video id="cam" playsinline muted autoplay webkit-playsinline></video>
  <div class="prompter" id="prompter">
    <div class="readline" id="readline"></div>
    <div class="ptext" id="ptext"></div>
  </div>
  <div class="heard" id="heard"><i></i><span id="heardT">点红色按钮开始</span></div>
  <div class="timer" id="timer">00:00</div>
  <div class="res" id="res"></div>
  <div class="mic" id="mic" hidden><span>声音</span><b><i id="micI"></i></b></div>
  <div class="sbar">
    <div class="l">
      <button class="chip" id="closeShoot" type="button" aria-label="返回">‹ 返回</button>
      <button class="chip" id="modeBtn" type="button">跟声音</button>
      <button class="chip" id="spdBtn" type="button" hidden>每秒 4 字</button>
    </div>
    <div class="r">
      <button class="chip" id="smaller" type="button" aria-label="字小一点">A-</button>
      <button class="chip" id="bigger" type="button" aria-label="字大一点">A+</button>
    </div>
    <button class="recbtn" id="recBtn" type="button" aria-label="开始录像"><i></i></button>
  </div>
  <div class="done" id="done" hidden>
    <button class="grab" id="grab" type="button" aria-label="收起或展开"><span id="grabT">往下拖可以收起</span></button>
    <video id="playback" playsinline controls webkit-playsinline></video>
    <div class="btns">
      <button class="go stop" id="retake" type="button">重拍</button>
      <button class="go" id="saveBtn" type="button">保存视频</button>
    </div>
    <button class="mini" id="doneBack" type="button">‹ 返回改台词</button>
    <a id="dl" href="#" hidden>保存不了？点这里打开视频，再长按保存</a>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // Safari ignores user-scalable=no, so block pinch and double-tap zoom by hand
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 300 && !e.target.closest('textarea, input, video')) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const SAMPLE = '（示例台词，换成你自己的）\n大家好。\n今天想跟大家聊一聊，孩子做数学题总是粗心，到底是怎么回事。\n其实很多时候不是不会，而是没有把题目读完。\n我们家现在的办法很简单：先圈题，再做题。';
  const ta = $('script');
  ta.value = load('tici.script') ?? SAMPLE;
  ta.addEventListener('input', () => { save('tici.script', ta.value); count(); });

  // word count and a rough length
  function count() {
    const n = [...ta.value].filter(ch => /[\p{L}\p{N}]/u.test(ch)).length;
    const sec = Math.round(n / 4);
    const len = sec < 60 ? `${sec} 秒` : `${Math.floor(sec / 60)} 分 ${String(sec % 60).padStart(2, '0')} 秒`;
    $('count').textContent = n ? `${n} 字 · 约 ${len}` : '';
  }
  count();

  // clear asks twice, so one stray tap can't wipe a long script
  let clearArmed = 0;
  const disarm = () => { clearArmed = 0; $('clear').textContent = '清空'; $('clear').classList.remove('warn'); };
  $('clear').onclick = () => {
    if (!clearArmed) {
      $('clear').textContent = '再点一次清空'; $('clear').classList.add('warn');
      clearArmed = setTimeout(disarm, 3000);
      return;
    }
    clearTimeout(clearArmed); disarm();
    ta.value = ''; save('tici.script', ''); count(); ta.dispatchEvent(new Event('input')); ta.focus();
  };

  function pickSeg(groupId, value, onPick) {
    const btns = document.querySelectorAll(`#${groupId} button`);
    btns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === value)));
    btns.forEach(b => b.addEventListener('click', () => {
      btns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      onPick(+b.dataset.v);
    }));
  }

  /* =====================================================================
     模式一：边说边滚
     ===================================================================== */
  const DIGITS = '零一二三四五六七八九';
  const isWord = ch => /[\p{L}\p{N}]/u.test(ch);
  const normCh = ch => /[0-9]/.test(ch) ? DIGITS[+ch] : ch.toLowerCase();
  const normStr = s => [...s].filter(isWord).map(normCh);

  let fsize = +(load('tici.fsize') || 30);
  pickSeg('fsize', fsize, v => { fsize = v; save('tici.fsize', String(v)); });

  let stream = null, rec = null, chunks = [], recStart = 0, timerId = 0;
  let norm = [], normSpans = [], pos = 0, shownPos = -1;
  let follow = true, recog = null, listening = false, heardBase = '';
  let evenTimer = 0, lastBlob = null, wakeLock = null;

  function buildPrompter() {
    const box = $('ptext'); box.innerHTML = ''; norm = []; normSpans = [];
    const frag = document.createDocumentFragment();
    for (const ch of ta.value.replace(/\r/g, '')) {
      if (ch === '\n') { frag.appendChild(document.createTextNode('\n')); continue; }
      const s = document.createElement('span'); s.textContent = ch;
      if (isWord(ch)) { s.dataset.i = norm.length; norm.push(normCh(ch)); normSpans.push(s); }
      frag.appendChild(s);
    }
    box.appendChild(frag);
    box.style.fontSize = fsize + 'px';
    pos = 0; shownPos = -1; render(true);
  }

  // where the reading line sits inside the prompter (second line)
  const readY = () => Math.round(fsize * 1.45 * 1.0);

  function render(force) {
    if (!normSpans.length) return;
    const p = Math.min(pos, normSpans.length - 1);
    if (!force && p === shownPos) return;
    // mark read / current
    const from = Math.max(0, Math.min(p, shownPos < 0 ? 0 : shownPos) - 1);
    const to = Math.max(p, shownPos) + 1;
    for (let i = (force ? 0 : from); i < (force ? normSpans.length : Math.min(to, normSpans.length)); i++) {
      normSpans[i].className = i < p ? 'd' : (i === p ? 'cur' : '');
    }
    shownPos = p;
    const span = normSpans[p];
    const y = span.offsetTop;
    $('ptext').style.transform = `translateY(${readY() - y}px)`;
    const rl = $('readline');
    rl.style.top = `calc(env(safe-area-inset-top, 0px) + 8px + ${readY() + fsize * 1.45 / 2 - 9}px)`;
  }

  // LCS length between two short arrays
  function lcs(a, b) {
    const m = a.length, n = b.length; let prev = new Array(n + 1).fill(0), cur = new Array(n + 1).fill(0);
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
      [prev, cur] = [cur, prev];
    }
    return prev[n];
  }

  // find where in the script the last few heard characters end
  function align(heard) {
    const tail = heard.slice(-10);
    if (tail.length < 3) return;
    const L = tail.length + 4;
    const lo = Math.max(tail.length - 2, pos - 20), hi = Math.min(norm.length, pos + 160);
    let best = -1, bestE = -1;
    for (let e = lo; e <= hi; e++) {
      const seg = norm.slice(Math.max(0, e - L), e);
      let s = lcs(tail, seg);
      if (seg[seg.length - 1] === tail[tail.length - 1]) s += 0.6;        // ends on the same char
      else if (seg[seg.length - 1] === tail[tail.length - 2]) s += 0.3;
      s -= Math.abs(e - pos) * 0.004;                                     // prefer staying close
      if (e < pos) s -= 0.5;                                              // going back needs a clearer match
      if (s > best) { best = s; bestE = e; }
    }
    const need = Math.max(3, Math.ceil(tail.length * 0.55));
    if (best >= need && bestE >= 0) {
      pos = Math.max(0, Math.min(norm.length - 1, bestE));
      render();
    }
  }

  function setHeard(text, on) {
    $('heardT').textContent = text;
    $('heard').classList.toggle('on', !!on);
  }
  function toast(msg, ms = 2600) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms);
  }

  // ---------- speech recognition (Apple, built in) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let audioStarted = null;
  function startListen() {
    if (!SR) { toast('这个浏览器听不了声音，已切到匀速'); setFollow(false); return; }
    if (listening) return;
    recog = new SR();
    recog.lang = 'zh-CN'; recog.continuous = true; recog.interimResults = true; recog.maxAlternatives = 1;
    heardBase = '';
    recog.onresult = e => {
      let txt = '';
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      const n = normStr(txt);
      setHeard('听到：' + txt.slice(-14), true);
      if (follow) align(n);
    };
    recog.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false; setFollow(false);
        toast('没拿到语音识别权限，已切到匀速。可在 设置 › Safari 里打开麦克风和语音识别');
      } else if (e.error === 'audio-capture') {
        listening = false; setFollow(false);
        toast('麦克风被录像占用，听不到声音，已切到匀速');
      }
    };
    recog.onend = () => {
      // iOS stops every so often; keep going while we still want to listen
      if (listening) { try { recog.start(); } catch (e) { setTimeout(() => listening && recog && recog.start(), 300); } }
      else setHeard(follow ? '没在听' : '匀速滚动中', false);
    };
    recog.onaudiostart = () => { if (audioStarted) audioStarted(); };
    listening = true;
    try { recog.start(); setHeard('在听…', true); } catch (e) { listening = false; }
  }
  function stopListen() {
    listening = false;
    if (recog) { try { recog.stop(); } catch (e) {} recog = null; }
  }

  // ---------- even-speed fallback ----------
  const SPEEDS = [3, 4, 5, 6, 7];
  let speed = Math.round(+(load('tici.speed') || 4));
  if (!SPEEDS.includes(speed)) speed = 4;
  $('spdBtn').textContent = `每秒 ${speed} 字`;
  $('spdBtn').onclick = () => {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    $('spdBtn').textContent = `每秒 ${speed} 字`;
    if (rec && rec.state === 'recording' && !follow) startEven();
  };
  function setFollow(on) {
    follow = on;
    $('modeBtn').textContent = on ? '跟声音' : '匀速';
    $('spdBtn').hidden = on;
    clearInterval(evenTimer);
    if (!on && rec && rec.state === 'recording') startEven();
    if (on && rec && rec.state === 'recording') startListen();
    if (!on) setHeard('匀速滚动中', false);
  }
  function startEven() {
    clearInterval(evenTimer);
    const cps = speed;
    evenTimer = setInterval(() => { pos = Math.min(norm.length - 1, pos + cps / 4); render(); }, 250);
  }
  $('modeBtn').onclick = () => setFollow(!follow);

  // tap a character to jump there
  $('ptext').addEventListener('click', e => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i != null) { pos = +i; render(); }
  });
  function resize(d) {
    fsize = Math.max(20, Math.min(48, fsize + d)); save('tici.fsize', String(fsize));
    $('ptext').style.fontSize = fsize + 'px'; shownPos = -1; render(true);
  }
  $('smaller').onclick = () => resize(-3);
  $('bigger').onclick = () => resize(3);

  // ---------- camera ----------
  const landQ = matchMedia('(orientation: landscape)');
  const isLand = () => landQ.matches;

  // Safari often hands out 640×480 unless asked again; ask for the biggest it will give,
  // in the shape the phone is held (wide when landscape, tall when portrait)
  async function bestRes(warn) {
    const vt = stream && stream.getVideoTracks()[0];
    if (!vt) return;
    const px = () => { const s = vt.getSettings(); return (s.width || 0) * (s.height || 0); };
    const wide = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } };
    const tall = { width: { ideal: 1080 }, height: { ideal: 1920 }, frameRate: { ideal: 30 } };
    for (const c of (isLand() ? [wide, tall] : [tall, wide]).concat([{ width: { min: 1280 }, height: { min: 720 } }])) {
      if (px() >= 1920 * 1080) break;
      const before = px();
      try { await vt.applyConstraints(Object.assign({ facingMode: 'user' }, c)); } catch (e) {}
      if (px() < before) { try { await vt.applyConstraints(wide); } catch (e) {} }
    }
    showRes();
    const st = vt.getSettings(), short = Math.min(st.width || 0, st.height || 0);
    if (warn && short && short < 720) toast(`摄像头只给了 ${st.width}×${st.height}，画面会糊`, 3500);
  }
  function showRes() {
    const vt = stream && stream.getVideoTracks()[0];
    if (!vt) return;
    const st = vt.getSettings(), short = Math.min(st.width || 0, st.height || 0);
    $('res').textContent = short ? `${short}p · ${isLand() ? '横屏' : '竖屏'}` : '';
  }

  // turning the phone: re-lay the prompter; between takes also re-ask for full resolution
  let lastLand = isLand();
  function onRotate() {
    if ($('shoot').hidden) return;
    const land = isLand();
    if (land !== lastLand) {
      lastLand = land;
      if (rec && rec.state === 'recording') toast('录像中转了手机，画面方向会乱。要换横竖，请先停止录像，转好再录', 4500);
      else setTimeout(() => bestRes(false), 400);
    }
    setTimeout(() => { shownPos = -1; render(true); showRes(); }, 350);
  }
  landQ.addEventListener ? landQ.addEventListener('change', onRotate) : landQ.addListener(onRotate);
  window.addEventListener('resize', onRotate);

  async function openCam() {
    $('fst').textContent = ''; $('fst').className = 'status';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('fst').textContent = '这个浏览器打不开摄像头，请用 iPhone 自带的 Safari 打开。'; $('fst').className = 'status err'; return;
    }
    // the floating-window mode may have set a play-only session, which blocks the mic
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
    // try the nicest settings first, then simpler ones; some phones refuse a combination
    const tries = [
      { video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true },
      { video: { facingMode: 'user' }, audio: true },
      { video: true, audio: true },
      { video: { facingMode: 'user' }, audio: false },
    ];
    let lastErr = null;
    stream = null;
    for (const c of tries) {
      try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch (e) { lastErr = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') break; }
    }
    if (!stream) {
      const n = lastErr ? lastErr.name : '';
      const why = {
        NotAllowedError: 'Safari 没给权限。点地址栏左边的“大小”图标 › 网站设置，把相机和麦克风改成“允许”；或到 设置 › App › Safari › 相机/麦克风 改成“询问”或“允许”。然后刷新网页再点一次。',
        NotReadableError: '摄像头正被别的 App 占着。把相机 App 和别的录像 App 从后台划掉，再点一次。',
        AbortError: '摄像头正被别的 App 占着。把相机 App 和别的录像 App 从后台划掉，再点一次。',
        NotFoundError: '没找到摄像头。',
        OverconstrainedError: '摄像头不支持这个设置。',
      }[n] || '原因不明。';
      $('fst').textContent = `没打开摄像头（${n || '未知'}${lastErr && lastErr.message ? '：' + lastErr.message : ''}）。${why}`;
      $('fst').className = 'status err'; return;
    }
    await bestRes(true);
    if (!stream.getAudioTracks().length) toast('没拿到麦克风，录出来的视频会没有声音', 3500);
    $('cam').srcObject = stream;
    $('shoot').hidden = false; $('done').hidden = true;
    document.body.style.overflow = 'hidden';
    buildPrompter();
    lastLand = isLand();
    setFollow(true);
    setHeard('点红色按钮开始', false);
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  $('openCam').onclick = openCam;

  function closeShoot() {
    stopRec(true);
    stopListen(); clearInterval(evenTimer);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; $('cam').srcObject = null;
    $('shoot').hidden = true; document.body.style.overflow = '';
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  $('closeShoot').onclick = closeShoot;
  // going back throws the take away, so ask twice unless it was saved
  let backArmed = 0;
  $('doneBack').onclick = () => {
    if (!saved && !backArmed) {
      $('doneBack').textContent = '视频还没保存，再点一次返回'; $('doneBack').classList.add('warn');
      backArmed = setTimeout(() => { backArmed = 0; $('doneBack').textContent = '‹ 返回改台词'; $('doneBack').classList.remove('warn'); }, 3000);
      return;
    }
    clearTimeout(backArmed); backArmed = 0; $('doneBack').textContent = '‹ 返回改台词'; $('doneBack').classList.remove('warn');
    closeShoot();
  };

  function pickType() {
    const list = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }
  // ---------- mic level meter: shows whether the recording is actually getting sound ----------
  let actx = null, meterRaf = 0, meterPeak = 0, silentWarned = false;
  function meter(track) {
    cancelAnimationFrame(meterRaf); meterPeak = 0; silentWarned = false;
    $('mic').hidden = !track;
    if (!track || !actx) return;
    let an;
    try {
      const src = actx.createMediaStreamSource(new MediaStream([track]));
      an = actx.createAnalyser(); an.fftSize = 512; src.connect(an);
    } catch (e) { return; }
    const buf = new Float32Array(an.fftSize);
    const loop = () => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      const lvl = Math.min(1, Math.sqrt(sum / buf.length) * 6);
      meterPeak = Math.max(meterPeak, lvl);
      $('micI').style.width = (lvl * 100).toFixed(0) + '%';
      if (!silentWarned && rec && rec.state === 'recording' && Date.now() - recStart > 4000 && meterPeak < 0.02) {
        silentWarned = true;
        toast(follow ? '录像收不到声音：麦克风可能被“跟声音”占走了。点左下角切到“匀速”再录试试' : '录像收不到声音，请检查麦克风权限', 5000);
      }
      meterRaf = requestAnimationFrame(loop);
    };
    loop();
  }

  let starting = false, recAudio = null;
  async function startRec() {
    if (!stream || starting) return;
    starting = true;
    $('recBtn').disabled = true; setHeard('准备中…', true);
    // must be created inside the tap
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    // Start the recogniser first, then take a fresh mic track, so the recording
    // and the recogniser share the audio session instead of fighting over it.
    if (follow) {
      startListen();
      await new Promise(r => { audioStarted = r; setTimeout(r, 1500); });
      audioStarted = null;
    }
    let aTrack = null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
    try { aTrack =(await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })).getAudioTracks()[0]; } catch (e) {}
    recAudio = aTrack;
    if (!aTrack) aTrack = stream.getAudioTracks().find(t => t.readyState === 'live') || null;
    const recStream = new MediaStream([stream.getVideoTracks()[0]].concat(aTrack ? [aTrack] : []));
    starting = false; $('recBtn').disabled = false;
    setHeard(follow ? '在听…说吧' : '匀速滚动中', follow);
    const type = pickType();
    try { rec = new MediaRecorder(recStream, type ? { mimeType: type, videoBitsPerSecond: 12_000_000, audioBitsPerSecond: 128_000 } : undefined); }
    catch (e) { toast('这个浏览器录不了像'); return; }
    if (!aTrack) toast('没拿到麦克风，录出来的视频会没有声音', 3500);
    chunks = [];
    rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
    rec.onstop = onRecStop;
    rec.start(1000);
    recStart = Date.now();
    $('recBtn').classList.add('on'); $('recBtn').setAttribute('aria-label', '停止录像');
    $('timer').classList.add('on');
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      $('timer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 500);
    meter(aTrack);
    if (!follow) startEven();
  }
  let discard = false, saved = false;
  function stopRec(drop) {
    discard = !!drop;
    clearInterval(timerId); clearInterval(evenTimer); stopListen();
    $('recBtn').classList.remove('on'); $('recBtn').setAttribute('aria-label', '开始录像');
    $('timer').classList.remove('on');
    if (rec && rec.state !== 'inactive') rec.stop();
    cancelAnimationFrame(meterRaf); $('mic').hidden = true;
    if (recAudio) { const t = recAudio; recAudio = null; setTimeout(() => t.stop(), 500); }
  }
  function onRecStop() {
    if (discard) { chunks = []; return; }
    const type = (rec && rec.mimeType) || 'video/mp4';
    lastBlob = new Blob(chunks, { type }); saved = false;
    const url = URL.createObjectURL(lastBlob);
    $('playback').src = url;
    $('dl').href = url; $('dl').hidden = false;
    $('done').hidden = false; setSheet(false);
    setHeard('录好了', false);
  }
  // ---------- result sheet: drag down to tuck it away, tap or drag up to bring it back ----------
  const sheet = $('done');
  let collapsed = false;
  function setSheet(c) {
    collapsed = c;
    sheet.classList.add('snap'); sheet.style.transform = '';
    sheet.classList.toggle('collapsed', c);
    $('grabT').textContent = c ? '录好了 · 点这里或往上拖展开' : '往下拖可以收起';
    if (c) $('playback').pause();
  }
  let dragY = null, dragD = 0, base = 0;
  $('grab').addEventListener('pointerdown', e => {
    dragY = e.clientY; dragD = 0;
    base = collapsed ? sheet.offsetHeight - 64 : 0;
    sheet.classList.remove('snap');
    $('grab').setPointerCapture(e.pointerId);
  });
  $('grab').addEventListener('pointermove', e => {
    if (dragY == null) return;
    dragD = e.clientY - dragY;
    const y = Math.max(0, Math.min(sheet.offsetHeight - 64, base + dragD));
    sheet.classList.remove('collapsed');
    sheet.style.transform = `translateY(${y}px)`;
  });
  const endDrag = () => {
    if (dragY == null) return;
    dragY = null;
    if (Math.abs(dragD) < 8) setSheet(!collapsed);          // a tap toggles
    else setSheet(collapsed ? dragD > -60 : dragD > 60);     // a drag past 60px flips it
  };
  $('grab').addEventListener('pointerup', endDrag);
  $('grab').addEventListener('pointercancel', endDrag);

  $('recBtn').onclick = () => { if (rec && rec.state === 'recording') stopRec(false); else startRec(); };

  $('retake').onclick = () => {
    $('done').hidden = true; $('playback').removeAttribute('src');
    pos = 0; shownPos = -1; render(true); $('timer').textContent = '00:00';
    setHeard('点红色按钮开始', false);
  };
  $('saveBtn').onclick = async () => {
    if (!lastBlob) return;
    const ext = lastBlob.type.includes('webm') ? 'webm' : 'mp4';
    const d = new Date(), stamp = `${d.getMonth() + 1}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
    const file = new File([lastBlob], `提词录像-${stamp}.${ext}`, { type: lastBlob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); saved = true; return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
  };

  // test hook for the alignment logic (no answers here, safe to expose)
  window.__tici = { align: t => { align(normStr(t)); return pos; }, setScript: s => { ta.value = s; buildPrompter(); }, get pos() { return pos; }, set pos(v) { pos = v; } };
})();
</script>
</body>
</html>
